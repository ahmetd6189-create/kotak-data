name: Kotak veri guncelle

on:
  schedule:
    # UTC saatleri. TR = UTC+3 -> 06:00, 12:00, 17:00, 21:00 TR
    - cron: "0 3,9,14,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Veriyi cek
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node scripts/fetch.mjs
      - name: Kaydet
        run: |
          git config user.name "kotak-bot"
          git config user.email "kotak-bot@users.noreply.github.com"
          git add data
          git commit -m "veri: $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "degisiklik yok"
          git push
